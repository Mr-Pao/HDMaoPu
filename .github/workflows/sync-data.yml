name: sync-data

# data/*.json 是「仓库当后台」的唯一数据源。
# 每次改完 data/ 里的 json 推到 cos，这个 workflow 会把它上传到 COS，
# 小程序端 GET {baseUrl}/data/<collection>.json 就能读到新数据。
#
# 为什么要有一份在 master（默认分支）：
#   GitHub 的「Run workflow」手动触发按钮，只对存在于默认分支的 workflow 显示。
#   本文件在 cos 上的那份负责 push 自动触发；这份在 master 上的负责手动补跑。
#   两者都用 actions/checkout + ref: cos 去跑 cos 分支的脚本，行为一致。
#   （同 set-inbox-policy.yml 的做法）

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只校验 JSON，不上传'
        type: boolean
        default: false

concurrency:
  group: sync-data
  # 不能取消进行中的 run：上传中途被杀会留下传了一半的数据
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 数据与脚本都在 cos 分支
          ref: cos

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        working-directory: scripts
        run: npm install cos-nodejs-sdk-v5 --no-save --no-audit --no-fund --registry=https://registry.npmmirror.com

      - name: 上传 data/*.json 到 COS
        working-directory: scripts
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
        run: node upload-data.js
