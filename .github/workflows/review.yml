name: review

# 只监听 Issue 评论。注意：issue_comment 事件只读取默认分支（master）上的
# workflow 定义，所以这个文件必须在 master 上也存在，否则线上不会触发。

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: write

concurrency:
  group: review-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      startsWith(github.event.comment.body, '/ok') ||
      startsWith(github.event.comment.body, '/no') ||
      startsWith(github.event.comment.body, '/approve') ||
      startsWith(github.event.comment.body, '/reject')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: cos

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        working-directory: scripts
        run: npm install --no-audit --no-fund --registry=https://registry.npmmirror.com

      # 兜底：上面的 if 表达式是 case-sensitive 且不 trim，这里再判一次，
      # 避免表达式写错导致对非审核评论也去改 COS 对象。
      - name: 检查评论命令
        id: guard
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          CMD="$(printf '%s' "$COMMENT_BODY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          echo "评论内容：$CMD"
          case "$CMD" in
            /ok*|/approve*|/no*|/reject*)
              echo "ok=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "不是审核命令，跳过"
              echo "ok=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: 执行审核
        if: steps.guard.outputs.ok == 'true'
        working-directory: scripts
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        run: node review.js

      # 审核通过时 review.js 会把照片记录追加进 data/photo.json，
      # 这里提交 data/ 变更回 cos 分支。
      # ⚠️ 不能指望这次提交触发 sync-data.yml：GITHUB_TOKEN 推的 commit 不会触发
      #    其他 workflow（GitHub 防递归的既定行为），所以下面必须自己传 COS。
      - name: Commit photo data
        if: always() && steps.guard.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/photo.json
          if git diff --staged --quiet; then
            echo "没有 photo.json 变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(data): 审核通过照片落库"
          git pull --rebase origin cos || { sleep 5; git pull --rebase origin cos; }
          git push || { sleep 5; git pull --rebase origin cos; git push; }

      - name: Upload data to COS
        if: always() && steps.guard.outputs.ok == 'true'
        working-directory: scripts
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        run: node upload-data.js
